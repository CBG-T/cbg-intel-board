<script>
const ITER = 200000;
const b64 = document.getElementById('payload').textContent.trim();

const SUPPORTED = !!(window.crypto && crypto.subtle && typeof DecompressionStream !== 'undefined');
if (!SUPPORTED) {
  const e = document.getElementById('err');
  if (e) e.textContent = (typeof DecompressionStream === 'undefined')
    ? '当前浏览器不支持 DecompressionStream（gzip 解压）。请升级到 Chrome / Edge 最新版打开。'
    : '当前环境不支持 Web Crypto（需 HTTPS 或 localhost）。请复制链接到 Chrome / Edge 打开。';
}

// 手动 base64 解码，避免 atob 对超大密文（~9MB）的尺寸限制
function b64ToBytes(b64str) {
  const ABC = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  const lut = {};
  for (let i = 0; i < 64; i++) lut[ABC[i]] = i;
  const s = b64str.replace(/[^A-Za-z0-9+/]/g, '');
  const out = new Uint8Array(Math.floor(s.length * 3 / 4));
  let p = 0;
  for (let i = 0; i < s.length; i += 4) {
    const c0 = lut[s[i]], c1 = lut[s[i + 1]];
    const c2 = (s[i + 2] === '=') ? 0 : lut[s[i + 2]];
    const c3 = (s[i + 3] === '=') ? 0 : lut[s[i + 3]];
    const n = (c0 << 18) | (c1 << 12) | (c2 << 6) | c3;
    out[p++] = (n >> 16) & 255;
    if (s[i + 2] !== '=') out[p++] = (n >> 8) & 255;
    if (s[i + 3] !== '=') out[p++] = n & 255;
  }
  return out;
}

async function deriveKey(password) {
  const blob = b64ToBytes(b64);
  const salt = blob.slice(0, 16);
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  // extractable=true 以便把派生密钥缓存到 localStorage，供同域新窗口免密自动解密
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations: ITER, hash:'SHA-256' },
    baseKey, { name:'AES-GCM', length:256 }, true, ['decrypt']
  );
}

async function decryptWithKey(key) {
  const blob = b64ToBytes(b64);
  const iv = blob.slice(16, 28);
  const ct = blob.slice(28);
  let plainGz;
  try {
    plainGz = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct);
  } catch (e) {
    const err = new Error('密码错误或数据已损坏');
    err.code = 'DECRYPT';
    throw err;
  }
  let html;
  try {
    const ds = new DecompressionStream('gzip');
    const stream = new Response(new Blob([plainGz]).stream().pipeThrough(ds));
    html = await stream.text();
  } catch (e) {
    const err = new Error('解密成功但解压失败（数据不完整，或浏览器不支持 gzip 流）。请用 Chrome / Edge 最新版桌面端打开。');
    err.code = 'DECOMPRESS';
    throw err;
  }
  const e = document.getElementById('err');
  if (e) e.textContent = '解密成功，正在打开看板…';
  try {
    // 用 Blob URL 让浏览器以正常文档加载器渲染 31MB 看板，避免 document.write 卡死主线程
    try { sessionStorage.setItem('lyxBoardOrigin', location.href); } catch (s) {}
    // 守卫：在 Blob 页面上把源站 URL 暴露为 window.__LYX_ORIGIN（全局变量，浏览器允许赋值），
    // 供看板内 lyxSafeReload() 在 3 小时自动刷新时重定向回源站（由壳用缓存密钥自动解密）。
    // 注意：Chrome 禁止重新赋值 location.reload（赋值会被静默丢弃），因此改用全局变量 + 看板内 safeReload 方案。
    const guard = '<script>(function(){try{var o=sessionStorage.getItem("lyxBoardOrigin");'
      + 'if(o&&location.protocol==="blob:"){window.__LYX_ORIGIN=o;}}catch(e){}})();<\/script>';
    const pos = html.indexOf('</head>');
    const html2 = pos !== -1 ? html.slice(0, pos) + guard + html.slice(pos) : guard + html;
    const blob = new Blob([html2], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    location.replace(url + location.hash);
  } catch (e) {
    try {
      document.open();
      document.write(html);
      document.close();
    } catch (e2) {
      const err = new Error('解密成功，但无法打开页面（内容过大或环境受限）。请改用 Chrome / Edge 桌面版打开。');
      err.code = 'WRITE';
      throw err;
    }
  }
}

function bytesToB64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

async function decryptAndShow(password) {
  const key = await deriveKey(password);
  // 缓存派生密钥（非明文密码），同域新窗口可免密自动解密；必须在导航前完成
  try {
    const raw = await crypto.subtle.exportKey('raw', key);
    localStorage.setItem('lyxBoardKey', bytesToB64(new Uint8Array(raw)));
  } catch (e) { /* 缓存失败不影响本次解密 */ }
  await decryptWithKey(key);
}

async function tryCachedKey() {
  const k = localStorage.getItem('lyxBoardKey');
  if (!k) return false;
  try {
    const raw = b64ToBytes(k);
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    await decryptWithKey(key);
    return true;
  } catch (e) {
    localStorage.removeItem('lyxBoardKey');
    return false;
  }
}

const btn = document.getElementById('btn');
const pw = document.getElementById('pw');
const err = document.getElementById('err');

async function attempt() {
  const p = pw.value;
  if (!p) { err.textContent = '请输入密码'; return; }
  if (!SUPPORTED) {
    err.textContent = (typeof DecompressionStream === 'undefined')
      ? '当前浏览器不支持 gzip 解压（DecompressionStream）。请改用 Chrome / Edge 最新版打开。'
      : '当前环境不支持 Web Crypto（需 HTTPS 或 localhost）。请复制链接到 Chrome / Edge 打开。';
    return;
  }
  btn.disabled = true; err.textContent = '解密中，请稍候…';
  try {
    await decryptAndShow(p);
  } catch (e) {
    err.textContent = (e && e.message) ? e.message : '密码错误或数据损坏';
    btn.disabled = false;
    if (!(e && e.code === 'DECRYPT')) pw.value = '';
    pw.focus();
  }
}
btn.addEventListener('click', attempt);
pw.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });

// 同域新窗口：命中缓存密钥则免密自动解密
window.addEventListener('DOMContentLoaded', () => {
  tryCachedKey().then(ok => {
    if (ok) {
      const gate = document.getElementById('gate');
      if (gate) gate.style.display = 'none';
    }
  });
});
</script>
